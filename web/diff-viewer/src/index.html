<!doctype html>
<html lang="en" class="shepherd-theme-light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Offline by construction (ADR 0003). `connect-src 'none'` kills fetch/XHR/WebSocket, and
      `default-src 'none'` means nothing loads unless listed below. `blob:` is required for the
      Monaco editor worker (see src/viewer/workerEnvironment.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; child-src blob:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>Shepherd diff</title>
    <!--
      The theme, decided before anything paints. `class="shepherd-theme-light"` on <html> above is
      the no-JS fallback and nothing else: this script runs before the stylesheet below is even
      requested, so the class the chrome is painted with is settled here and never flashes.

      `window.__shepherdTheme` is set by the app's own WKUserScript at document start
      (`DiffViewerView.themeBootstrap(_:)`), which runs before this file's <head> is parsed. It
      wins, because Shepherd can be forced dark while macOS is light and only the app knows that.
      `prefers-color-scheme` is the answer for every other host — the dev harness, which carries
      the same boot script (src/dev/index.html), or dist/ opened in a browser. Inline rather than a file for the
      obvious reason: a request is a paint later. Add/remove rather than assigning `className`,
      so this and the bridge's `setTheme` (src/viewer/monacoViewer.ts) toggle the class the same
      way and neither can wipe something the other put there.
    -->
    <script>
      (function () {
        var forced = window.__shepherdTheme;
        var isDark = forced ? forced === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var root = document.documentElement.classList;
        root.remove('shepherd-theme-light', 'shepherd-theme-dark');
        root.add(isDark ? 'shepherd-theme-dark' : 'shepherd-theme-light');
      })();
    </script>
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <div id="shepherd-diff"></div>
    <div id="shepherd-error" role="alert" aria-live="polite"></div>
    <script src="./viewer.js"></script>
  </body>
</html>
