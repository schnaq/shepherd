name: Shepherd
options:
  bundleIdPrefix: com.schnaq
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # English is the key language of `Shepherd/Resources/Localizable.xcstrings` and therefore the
  # project's development language: every key in the catalog *is* its English string, so a key
  # with no translation falls back to English by construction (ADR 0022). German is the only
  # added language and needs nothing here — Xcode reads the languages out of the catalog itself,
  # so there is no `knownRegions` list and no `.lproj` directory to keep in step.
  developmentLanguage: en

packages:
  ShepherdKit:
    path: Packages/ShepherdKit
  # Sparkle 2 for in-app updates (ADR 0010). It is a *remote* package and it belongs to the app
  # target only: `Packages/ShepherdKit` must keep building on Linux, and the CLI target is a URL
  # builder that has no business talking to an update feed.
  #
  # Pinned to an exact version on purpose. `Shepherd.xcodeproj` is generated and therefore
  # gitignored, so `Package.resolved` is not committed — with a range, two machines (or the CI
  # runner and the release runner) could resolve different Sparkle builds for the same commit.
  # Bumping is one line here plus a `NOTICES.md` line; see docs/RELEASING.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  Shepherd:
    type: application
    platform: macOS
    sources:
      - path: Shepherd
        excludes:
          - "Resources/DiffViewer"
          - "Resources/DiffViewer/**"
          - "Resources/Localizable.xcstrings"
      # The String Catalog (ADR 0022), named explicitly with its build phase rather than left to
      # the glob above. XcodeGen infers a file's phase from its extension, and `.xcstrings` is a
      # young enough type that "which XcodeGen is on the runner" would decide whether the catalog
      # is compiled as a resource or handed to the Swift compiler — the second one is a build
      # error, and CI installs XcodeGen from Homebrew rather than pinning it. Saying it here
      # costs one line and removes the question.
      - path: Shepherd/Resources/Localizable.xcstrings
        buildPhase: resources
      # The built web bundle goes in as a *folder reference* so `index.html` keeps its
      # relative `./viewer.js` / `./viewer.css` links and `loadFileURL(_:allowingReadAccessTo:)`
      # can hand the webview exactly one directory (ADR 0003).
      - path: Shepherd/Resources/DiffViewer
        type: folder
        buildPhase: resources
    dependencies:
      - package: ShepherdKit
        product: ShepherdCore
      - package: ShepherdKit
        product: GitHubKit
      - package: ShepherdKit
        product: ShepherdPersistence
      - package: ShepherdKit
        product: ShepherdSync
      # Distributed as a binary XCFramework, so Xcode embeds and signs it for us; no extra
      # copy phase and nothing to re-sign by hand (ADR 0010).
      - package: Sparkle
        product: Sparkle
    entitlements:
      path: Shepherd/Support/Shepherd.entitlements
    info:
      path: Shepherd/Support/Info.plist
      properties:
        CFBundleDisplayName: Shepherd
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT licensed — The Shepherd contributors"
        CFBundleIconName: AppIcon
        # The `shepherd://` deep-link scheme (ADR 0013). This is what makes `open
        # shepherd://sync`, Raycast, and the companion `shepherd` CLI work; the app parses
        # every incoming URL with `DeepLink.parse` and does nothing else with it.
        CFBundleURLTypes:
          - CFBundleURLName: com.schnaq.shepherd.deeplink
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - shepherd
        # ── Sparkle 2 (ADR 0010) ────────────────────────────────────────────────────────────
        # The feed is the `appcast.xml` asset of the newest published GitHub release.
        # `releases/latest/download/<asset>` is a permanent URL that GitHub redirects to
        # whatever the current latest (non-prerelease) release holds, so publishing the release
        # *is* publishing the feed: no second host, no `gh-pages` branch, no commit that has to
        # land after the tag, and nothing to keep in step by hand. The alternative — a
        # GitHub-Pages URL — needs a second workflow and a second place a release can be half
        # done. See docs/RELEASING.md.
        SUFeedURL: https://github.com/schnaq/review/releases/latest/download/appcast.xml
        #
        # PLACEHOLDER. The real value is the base64 public key that `generate_keys` prints once,
        # on the maintainer's Mac (docs/RELEASING.md § Sparkle keys). Until it is replaced,
        # `UpdateController` refuses to start the updater at all — it checks that the key
        # base64-decodes to exactly 32 bytes — so the app runs, "Check for Updates…" is disabled
        # with a reason, and Sparkle never gets the chance to put a misconfiguration alert in
        # front of anyone. Never commit the *private* key; it lives in the login Keychain and in
        # the `SPARKLE_PRIVATE_KEY` GitHub secret.
        SUPublicEDKey: REPLACE_WITH_SUPublicEDKey_FROM_generate_keys
        #
        # Automatic checks are on out of the box and switchable off in Settings → Account
        # (ADR 0010: "auto-update is opt-out"). Setting this also suppresses Sparkle's own
        # second-launch permission prompt, which would otherwise ask a question the Settings
        # toggle already answers.
        SUEnableAutomaticChecks: true
        # Once a day.
        SUScheduledCheckInterval: 86400
        # Never append the anonymous system profile (CPU, macOS version, language, …) to the feed
        # request. Off is Sparkle's default, but "no telemetry, ever" is a hard line in
        # CONTRIBUTING.md and a hard line should be stated, not inherited.
        SUSendProfileInfo: false
        # Sparkle may *find* an update in the background but never download-and-install one
        # silently: unsent review drafts live in the local database (ADR 0006) and an app that
        # replaces itself mid-review is hostile. Every update is presented and confirmed.
        SUAllowsAutomaticUpdates: false
        # `SUEnableInstallerLauncherService` / `SUEnableDownloaderService` are deliberately
        # absent: they exist for sandboxed apps that need Sparkle's XPC services, and Shepherd
        # is unsandboxed by decision (Shepherd/Support/Shepherd.entitlements). Hardened runtime
        # is on — Sparkle 2 supports it without any extra entitlement.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schnaq.shepherd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete

  # The companion CLI (ADR 0013): a thin URL builder that talks to the app only through the
  # `shepherd://` scheme. It links ShepherdCore for the shared grammar and nothing else — no
  # GitHubKit, no persistence — which is the security boundary, expressed as a dependency list.
  ShepherdCLI:
    type: tool
    platform: macOS
    sources:
      - path: ShepherdCLI
    dependencies:
      - package: ShepherdKit
        product: ShepherdCore
    settings:
      base:
        # The product is `shepherd`, lowercase, because that is what users type.
        PRODUCT_NAME: shepherd
        PRODUCT_BUNDLE_IDENTIFIER: com.schnaq.shepherd.cli
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete

  ShepherdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShepherdTests
      # The Swift⇄web bridge fixtures are the shared contract corpus: the same files the
      # TypeScript suite validates are copied into the test bundle as a folder reference, so
      # a fixture added on the web side is picked up here without touching this file.
      - path: web/diff-viewer/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Shepherd
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"

schemes:
  Shepherd:
    build:
      targets:
        Shepherd: all
        ShepherdTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShepherdTests

  # The CLI gets its own scheme rather than joining the app's: the app scheme's Run action
  # should stay the app, and CI builds this one separately (ADR 0013). The scheme is named
  # after the target, not after the product — `shepherd.xcscheme` and `Shepherd.xcscheme`
  # would be the same file on a case-insensitive volume.
  ShepherdCLI:
    build:
      targets:
        ShepherdCLI: all
    run:
      config: Debug
