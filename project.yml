name: Shepherd
options:
  bundleIdPrefix: com.schnaq
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  # English is the key language of `Shepherd/Resources/Localizable.xcstrings` and therefore the
  # project's development language: every key in the catalog *is* its English string, so a key
  # with no translation falls back to English by construction (ADR 0022). German is the only
  # added language. XcodeGen has no `knownRegions` option; it derives the project's languages
  # from the `.lproj` directories it finds, which is what `Shepherd/Resources/de.lproj` is for —
  # a one-comment `InfoPlist.strings` whose only job is to put `de` in `knownRegions`, so that
  # Xcode compiles the German half of the catalog on a project it did not create itself.
  developmentLanguage: en

packages:
  ShepherdKit:
    path: Packages/ShepherdKit
  # Sparkle 2 for in-app updates (ADR 0010). It is a *remote* package and it belongs to the app
  # target only: `Packages/ShepherdKit` must keep building on Linux, and the CLI target is a URL
  # builder that has no business talking to an update feed.
  #
  # Pinned to an exact version on purpose. `Shepherd.xcodeproj` is generated and therefore
  # gitignored, so `Package.resolved` is not committed — with a range, two machines (or the CI
  # runner and the release runner) could resolve different Sparkle builds for the same commit.
  # Bumping is one line here plus a `NOTICES.md` line; see docs/RELEASING.md.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Claude as a Foundation Models `LanguageModel` (ADR 0038, programme item 1; ADR 0031's seam).
  # App target only, for Sparkle's reason, and pinned exactly for Sparkle's reason too — plus
  # ADR 0031's: a model bridge changes generation behaviour between releases in ways a compiler
  # cannot see, so a bump is a reviewed change. Apache-2.0; NOTICES.md carries the line.
  ClaudeForFoundationModels:
    url: https://github.com/anthropics/ClaudeForFoundationModels
    exactVersion: 0.2.1

targets:
  Shepherd:
    type: application
    platform: macOS
    sources:
      - path: Shepherd
        excludes:
          - "Resources/DiffViewer"
          - "Resources/DiffViewer/**"
          - "Resources/Localizable.xcstrings"
          - "Resources/AppShortcuts.xcstrings"
      # The String Catalog (ADR 0022), named explicitly with its build phase rather than left to
      # the glob above. XcodeGen infers a file's phase from its extension, and `.xcstrings` is a
      # young enough type that "which XcodeGen is on the runner" would decide whether the catalog
      # is compiled as a resource or handed to the Swift compiler — the second one is a build
      # error, and CI installs XcodeGen from Homebrew rather than pinning it. Saying it here
      # costs one line and removes the question.
      - path: Shepherd/Resources/Localizable.xcstrings
        buildPhase: resources
      # The Siri phrase catalog (ADR 0022 § Amendment), here for the same reason and named the
      # same way. It is a second `.xcstrings` rather than more rows in the first one because App
      # Shortcut phrases are not `Localizable` keys: the App Intents metadata processor reads the
      # phrases out of `ShepherdShortcuts` and looks their translations up in a file that has to
      # be called `AppShortcuts.xcstrings` — the name is the contract, which is also why
      # `Scripts/check-localization.py` does not look at it.
      - path: Shepherd/Resources/AppShortcuts.xcstrings
        buildPhase: resources
      # The built web bundle goes in as a *folder reference* so `index.html` keeps its
      # relative `./viewer.js` / `./viewer.css` links and `loadFileURL(_:allowingReadAccessTo:)`
      # can hand the webview exactly one directory (ADR 0003).
      - path: Shepherd/Resources/DiffViewer
        type: folder
        buildPhase: resources
    dependencies:
      - package: ShepherdKit
        product: ShepherdCore
      - package: ShepherdKit
        product: GitHubKit
      - package: ShepherdKit
        product: ShepherdPersistence
      - package: ShepherdKit
        product: ShepherdSync
      # Distributed as a binary XCFramework, so Xcode embeds and signs it for us; no extra
      # copy phase and nothing to re-sign by hand (ADR 0010).
      - package: Sparkle
        product: Sparkle
      - package: ClaudeForFoundationModels
        product: ClaudeForFoundationModels
    entitlements:
      path: Shepherd/Support/Shepherd.entitlements
      # XcodeGen writes this file from the properties below on every run, so the keys live
      # here and not only in the generated plist: a `xcodegen` run against a `path` with no
      # `properties` emptied it to `<dict/>` once and took the reasoning with it.
      #
      # The App Sandbox is OFF for v1, deliberately.
      #
      # "Delegate to local agent" (ADR 0011) runs two kinds of subprocess on the user's own
      # machine: `git` against a checkout the user picked, and the locally installed agent CLI
      # (Claude Code by default) inside a Shepherd-managed worktree. A sandboxed app can spawn a
      # child, but the child inherits the sandbox — it would lose network access, it could not
      # read the user's `~/.claude` configuration or credential helper, and every path outside
      # the container would need a security-scoped bookmark. That is not a usable coding agent.
      #
      # This costs nothing we had: ADR 0010 already rules the Mac App Store out for v1, and
      # distribution is Developer ID + notarization, which does not require the sandbox.
      # Hardened runtime stays on (`ENABLE_HARDENED_RUNTIME`, below).
      #
      # Revisit if an App Store build is ever wanted: it would mean dropping delegation from
      # that build, or moving the subprocess work into a separate, non-sandboxed helper.
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: Shepherd/Support/Info.plist
      properties:
        CFBundleDisplayName: Shepherd
        CFBundleShortVersionString: "1.14.0"
        CFBundleVersion: "29"
        LSApplicationCategoryType: public.app-category.developer-tools
        # schnaq GmbH is named beside the contributors because it is who publishes Shepherd:
        # the Developer ID on the signature says schnaq GmbH, and an About box that does not is
        # an About box that disagrees with Gatekeeper. The licence is unchanged — MIT, and
        # `LICENSE` still holds the copyright for everyone who has written a line of it
        # (ADR 0009).
        NSHumanReadableCopyright: "MIT licensed — schnaq GmbH and the Shepherd contributors"
        CFBundleIconName: AppIcon
        # The `shepherd://` deep-link scheme (ADR 0013). This is what makes `open
        # shepherd://sync`, Raycast, and the companion `shepherd` CLI work; the app parses
        # every incoming URL with `DeepLink.parse` and does nothing else with it.
        CFBundleURLTypes:
          - CFBundleURLName: com.schnaq.shepherd.deeplink
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - shepherd
        # ── Sparkle 2 (ADR 0010) ────────────────────────────────────────────────────────────
        # The feed is the `appcast.xml` asset of the newest published GitHub release.
        # `releases/latest/download/<asset>` is a permanent URL that GitHub redirects to
        # whatever the current latest (non-prerelease) release holds, so publishing the release
        # *is* publishing the feed: no second host, no `gh-pages` branch, no commit that has to
        # land after the tag, and nothing to keep in step by hand. The alternative — a
        # GitHub-Pages URL — needs a second workflow and a second place a release can be half
        # done. See docs/RELEASING.md.
        SUFeedURL: https://github.com/schnaq/shepherd/releases/latest/download/appcast.xml
        #
        # PLACEHOLDER. The real value is the base64 public key that `generate_keys` prints once,
        # on the maintainer's Mac (docs/RELEASING.md § Sparkle keys). Until it is replaced,
        # `UpdateController` refuses to start the updater at all — it checks that the key
        # base64-decodes to exactly 32 bytes — so the app runs, "Check for Updates…" is disabled
        # with a reason, and Sparkle never gets the chance to put a misconfiguration alert in
        # front of anyone. Never commit the *private* key; it lives in the login Keychain and in
        # the `SPARKLE_PRIVATE_KEY` GitHub secret.
        SUPublicEDKey: Mz8sRldKXn8lJgYA6Zg7SzbWICXoLe1lmNCFk2X4WQw=
        #
        # Automatic checks are on out of the box and switchable off in Settings → Account
        # (ADR 0010: "auto-update is opt-out"). Setting this also suppresses Sparkle's own
        # second-launch permission prompt, which would otherwise ask a question the Settings
        # toggle already answers.
        SUEnableAutomaticChecks: true
        # Once a day.
        SUScheduledCheckInterval: 86400
        # Never append the anonymous system profile (CPU, macOS version, language, …) to the feed
        # request. Off is Sparkle's default, but it should be stated rather than inherited — and
        # it stays off now that ADR 0036 has narrowed the promise around it: what Shepherd counts
        # is thirteen allow-listed events it sends itself, from one place, switchable off in one
        # click. An updater appending an unasked-for profile to a feed request is none of that.
        SUSendProfileInfo: false
        #
        # ── Usage telemetry (ADR 0036) ──────────────────────────────────────────────────────
        # PLACEHOLDER, and it stays a placeholder in the repository. The real value is the
        # PostHog EU project's *public* write key, written into the built bundle's Info.plist by
        # Scripts/release.sh from the POSTHOG_TOKEN secret, before code signing — after signing
        # it could not be written, because the signature covers this file. Empty here means
        # `AppConfig.postHogProjectKey` answers nil, `UsageTelemetry` is never constructed, and a
        # development build, a test run and a fork therefore have no queue, no timer and no
        # request at all. The key is public by design: it ships in every binary and `strings`
        # will find it, which is why it is not a secret in the app and why the numbers it
        # produces are indicators rather than bookkeeping.
        SHPostHogProjectKey: ""
        # Sparkle may *find* an update in the background but never download-and-install one
        # silently: unsent review drafts live in the local database (ADR 0006) and an app that
        # replaces itself mid-review is hostile. Every update is presented and confirmed.
        SUAllowsAutomaticUpdates: false
        # `SUEnableInstallerLauncherService` / `SUEnableDownloaderService` are deliberately
        # absent: they exist for sandboxed apps that need Sparkle's XPC services, and Shepherd
        # is unsandboxed by decision (Shepherd/Support/Shepherd.entitlements). Hardened runtime
        # is on — Sparkle 2 supports it without any extra entitlement.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schnaq.shepherd
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete

  # The companion CLI (ADR 0013): a thin URL builder that talks to the app only through the
  # `shepherd://` scheme. It links ShepherdCore for the shared grammar and nothing else — no
  # GitHubKit, no persistence — which is the security boundary, expressed as a dependency list.
  ShepherdCLI:
    type: tool
    platform: macOS
    sources:
      - path: ShepherdCLI
    dependencies:
      - package: ShepherdKit
        product: ShepherdCore
    settings:
      base:
        # The product is `shepherd`, lowercase, because that is what users type.
        PRODUCT_NAME: shepherd
        PRODUCT_BUNDLE_IDENTIFIER: com.schnaq.shepherd.cli
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete

  # The iPhone companion (ADR 0044). Its own composition root and screens live in `ShepherdPhone/`;
  # the review logic does not — it is the Mac's own `ReviewModel`, `InboxModel`, `SignedInSession`
  # and `PullRequestActions`, compiled a second time from the list below ("Route B"). A list and
  # not a folder, because most of `Shepherd/` is AppKit, App Intents or the Mac's composition
  # root, and every entry here is a promise that the file builds for iOS. The `ios` job in
  # .github/workflows/ci.yml is what keeps that promise honest: a Mac change that gives one of
  # these files a Mac-only dependency fails CI rather than surprising the next phone build.
  #
  # Some entries are here only because a shared type *names* them — `AppSettings`' stored
  # properties pull in the webhook, S3/SigV4, agent-CLI and editor configuration types,
  # `PullRequestActions` the optional telemetry, `ReviewModel`/`InboxModel` the intelligence
  # router — and `PhoneEnvironment` never constructs any of them ("compiled, never instantiated").
  #
  # NEVER add `SettingsSync/SettingsSyncCrypto.swift` (AES-GCM, PBKDF2) or
  # `Automation/WebhookSignature.swift`: `ITSAppUsesNonExemptEncryption` below is NO because this
  # binary carries no cipher, and Scripts/testflight.sh refuses to upload one that does.
  ShepherdPhone:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: ShepherdPhone
        excludes:
          # Read by Scripts/testflight.sh at export time, never bundled.
          - "Support/ExportOptions.plist"
      - path: Shepherd
        includes:
          # Folder globs on purpose — a new file in either folder is shared by default — and
          # top level only: `Intelligence/Translation/` reaches `AppEnvironment`.
          - "Intelligence/*.swift"
          - "Telemetry/*.swift"
          - "App/ActionActivity.swift"
          - "App/SignedInSession.swift"
          - "App/ToastCenter.swift"
          - "Automation/TrackRecordCoordinator.swift"
          - "Automation/WebhookEvent.swift"
          # The demo mode's sample data and its keychain/transport fakes, for the phone's own
          # `DemoMode` (ShepherdPhone/Support/MacOnlyStubs.swift). By name, never `Debug/*`:
          # `Debug/DemoMode.swift` builds the Mac's `AppEnvironment`. All three are `#if DEBUG`.
          - "Debug/DemoFakes.swift"
          - "Debug/DemoSeed.swift"
          - "Debug/DemoShowcase.swift"
          - "Features/Delegation/DelegationContext.swift"
          - "Features/Delegation/SessionBackChannel.swift"
          - "Features/DiffViewer/BridgeProtocol.swift"
          - "Features/DiffViewer/DiffListContent.swift"
          - "Features/DiffViewer/DiffRenderer.swift"
          - "Features/DiffViewer/DiffRowText.swift"
          - "Features/DiffViewer/DiffViewerContent.swift"
          - "Features/DiffViewer/MonacoLanguage.swift"
          - "Features/DiffViewer/SyntaxStyle.swift"
          - "Features/Inbox/ContentKind.swift"
          - "Features/Inbox/InboxModel.swift"
          - "Features/Inbox/InboxSelectionAnchor.swift"
          - "Features/Inbox/RowWriteState.swift"
          - "Features/Inbox/TrustLanes.swift"
          - "Features/Onboarding/SignInModel.swift"
          - "Features/PullRequest/MergeMethodPicker.swift"
          - "Features/PullRequest/PullRequestActions.swift"
          - "Features/PullRequest/PullRequestMoreMenu.swift"
          - "Features/PullRequest/PullRequestStackCard.swift"
          - "Features/Review/AIDraftFieldState.swift"
          - "Features/Review/ConversationOverlay.swift"
          - "Features/Review/FileCategoryLabel.swift"
          - "Features/Review/FilePriorityReasonText.swift"
          - "Features/Review/PostEditing.swift"
          - "Features/Review/ReviewModel.swift"
          - "Features/Review/ReviewUpdateBanner.swift"
          - "Features/Review/SinceReview.swift"
          - "Features/Review/SinceReviewFindingsView.swift"
          - "Features/Triage/TriageCoordinator.swift"
          - "SettingsSync/S3ObjectClient.swift"
          - "SettingsSync/SettingsSyncError.swift"
          - "SettingsSync/SigV4Signer.swift"
          - "Support/AgentCLI/AgentCLIConfiguration.swift"
          - "Support/AgentCLI/ShellWords.swift"
          - "Support/AppConfig.swift"
          - "Support/AppSettings.swift"
          - "Support/AsyncActionState.swift"
          - "Support/AvatarView.swift"
          - "Support/CanonicalJSON.swift"
          - "Support/CredentialSafeSession.swift"
          - "Support/DesignComponents.swift"
          - "Support/Editor/EditorConfiguration.swift"
          - "Support/ErrorDescription.swift"
          - "Support/GitHubErrorText.swift"
          - "Support/HTTPHeaders.swift"
          - "Support/HexEncoding.swift"
          - "Support/KeyboardShortcuts.swift"
          - "Support/KeychainTokenStore.swift"
          - "Support/MarkdownHTML.swift"
          - "Support/MarkdownTextView.swift"
          - "Support/PlatformServices.swift"
          - "Support/RelativeDateText.swift"
          - "Support/SpokenRow.swift"
          - "Support/Theme.swift"
      # One String Catalog for both apps, named with its phase for the Mac target's reason. A
      # phone string is a row in the same file and German comes for free where the Mac already
      # says the same thing (ADR 0022).
      - path: Shepherd/Resources/Localizable.xcstrings
        buildPhase: resources
    dependencies:
      - package: ShepherdKit
        product: ShepherdCore
      - package: ShepherdKit
        product: GitHubKit
      - package: ShepherdKit
        product: ShepherdPersistence
      - package: ShepherdKit
        product: ShepherdSync
      # Linked because the shared `Intelligence/` files name it; the phone keeps the router at
      # `.disabled` and never builds a provider. No Sparkle: Apple updates this app.
      - package: ClaudeForFoundationModels
        product: ClaudeForFoundationModels
    info:
      # Generated by XcodeGen from the keys below, and git-ignored for the Mac plist's reason.
      path: ShepherdPhone/Support/Info.plist
      properties:
        CFBundleDisplayName: Shepherd
        # Both follow the build settings below, so Scripts/testflight.sh can stamp a fresh build
        # number with `CURRENT_PROJECT_VERSION=…` and the version is bumped in one place.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Landscape so a wide diff can be read sideways; never upside down.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Export compliance (ADR 0044). The only encryption this app *uses* is the system's:
        # HTTPS through URLSession and the Keychain. The CryptoKit symbols in the binary are
        # SHA-256 and HMAC — `SigV4Signer`, compiled in through `AppSettings`, and the App Attest
        # request signing inside ClaudeForFoundationModels — which authenticate and check
        # integrity rather than encrypt, and are exempt. No AES, no ChaChaPoly, no CommonCrypto
        # cipher or key derivation: Scripts/testflight.sh checks the archived binary for exactly
        # those symbols and refuses to upload if one appears, because this answer would change.
        ITSAppUsesNonExemptEncryption: false
        # Deliberately absent in v1 (ADR 0044): `UIBackgroundModes` and
        # `BGTaskSchedulerPermittedIdentifiers` (no background refresh — the outbox drains in a
        # `beginBackgroundTask` window instead) and `CFBundleURLTypes` (no `shepherd://` links).
    settings:
      base:
        PRODUCT_NAME: Shepherd
        PRODUCT_BUNDLE_IDENTIFIER: com.schnaq.shepherd.ios
        # The phone's own version line, independent of the Mac's; bumped by hand.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        # Not offered on Apple Silicon Macs (the real Mac app is right there) or on visionOS.
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Apple distributes this one, so it is signed by the team with an App Store profile that
        # Xcode manages — unlike the Mac app's ad-hoc development signature.
        DEVELOPMENT_TEAM: L99L6DPKC7
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  ShepherdTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShepherdTests
      # The Swift⇄web bridge fixtures are the shared contract corpus: the same files the
      # TypeScript suite validates are copied into the test bundle as a folder reference, so
      # a fixture added on the web side is picked up here without touching this file.
      - path: web/diff-viewer/fixtures
        type: folder
        buildPhase: resources
      # The intelligence evaluation corpus (docs/plans/apple-intelligence-v2.md §0.4): anonymised
      # pull requests with an expected verdict, and CI log tails with an expected diagnosis. A
      # folder reference for the same two reasons as the corpus above — a fixture added by hand
      # needs no change here, and `IntelligenceEvalTests` walks the directory rather than a list.
      # It rides along in every build of the test bundle; what is gated is the *harness*, which
      # skips itself unless `SHEPHERD_EVAL=1` is set, so CI copies a few kilobytes of JSON and
      # runs none of it.
      - path: Tests/Fixtures/eval
        type: folder
        buildPhase: resources
    dependencies:
      - target: Shepherd
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"

schemes:
  Shepherd:
    build:
      targets:
        Shepherd: all
        ShepherdTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShepherdTests

  # The CLI gets its own scheme rather than joining the app's: the app scheme's Run action
  # should stay the app, and CI builds this one separately (ADR 0013). The scheme is named
  # after the target, not after the product — `shepherd.xcscheme` and `Shepherd.xcscheme`
  # would be the same file on a case-insensitive volume.
  ShepherdCLI:
    build:
      targets:
        ShepherdCLI: all
    run:
      config: Debug

  # The iPhone app (ADR 0044), with an archive action for Scripts/testflight.sh.
  ShepherdPhone:
    build:
      targets:
        ShepherdPhone: all
    run:
      config: Debug
    archive:
      config: Release
