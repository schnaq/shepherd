# The product page at shepherd.schnaq.com: built and typechecked on every change under site/.
#
# A workflow of its own rather than a job in ci.yml, because it has nothing to do with the app —
# a different runner and a different toolchain. The `paths` filter keeps a Swift commit from
# rebuilding a page it did not touch.
#
# It does not deploy. Vercel's Git integration is connected to this repository and deploys main
# to production and every pull request to a preview on its own; a second deploy from here would
# ship the same commit twice. This workflow is the gate in front of that: a page that does not
# build or typecheck fails the check on the pull request before Vercel ever sees it on main.
name: Site

on:
  push:
    branches: ["main"]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Bun installs and runs the scripts, Node runs Next: `next build` does not get through
      # page-data collection under Bun's runtime (site/README.md), and Vercel builds with Node too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
