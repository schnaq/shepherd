name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  diff-viewer:
    name: Diff viewer (Node)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: web/diff-viewer
      - run: npm test
        working-directory: web/diff-viewer
      - run: npm run build
        working-directory: web/diff-viewer
      - name: Ensure committed dist is up to date
        run: git diff --exit-code -- Shepherd/Resources/DiffViewer/dist || (echo "::error::web bundle out of date — run 'npm run build' in web/diff-viewer and commit" && exit 1)

  shepherdkit-linux:
    name: ShepherdKit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before Swift, because it is the fast check and the one an Xcode-less contributor cannot
      # run any other way: a `String(localized:)` with no German row in the String Catalog builds
      # fine and silently shows English (ADR 0022). Python 3 stdlib only, no setup step.
      - name: Check the String Catalog against the source
        run: python3 Scripts/check-localization.py
      # Same reason, different invariant: a `.font(.system(size:))` added to a surface that has
      # moved onto the type scale compiles fine and then refuses to grow with macOS's Larger Text
      # setting, next to text that does (ADR 0033).
      - name: Check the type scale
        run: python3 Scripts/check-type-scale.py
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      # GRDB links the system SQLite; its SwiftPM system-library target needs the headers.
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: swift test
        working-directory: Packages/ShepherdKit

  shepherdkit-macos:
    name: ShepherdKit tests (macOS)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Packages/ShepherdKit

  app:
    name: App build (macOS)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      # The runner keeps two Xcodes side by side. The newest one whose SDK the app's deployment
      # target needs is selected per job through DEVELOPER_DIR; nothing on the machine is
      # switched globally, so the ShepherdKit job above keeps building with the default Xcode.
      # Until an Xcode 27 exists at one of these paths the step is a no-op and the default is used.
      - name: Select the newest Xcode on the runner
        run: |
          for candidate in /Applications/Xcode-27*.app /Applications/Xcode-beta.app; do
            if [ -d "$candidate/Contents/Developer" ]; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              echo "Using $candidate"
              break
            fi
          done
      - name: Show the toolchain this build uses
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i macosx || true
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')- SDKs: $(xcodebuild -showsdks | grep -o 'macosx[0-9.]*' | tr '\n' ' ')"
      - name: Build diff viewer bundle
        run: npm ci && npm run build
        working-directory: web/diff-viewer
      - name: Install XcodeGen if missing
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: xcodegen generate
      - name: Build app
        run: |
          xcodebuild -project Shepherd.xcodeproj -scheme Shepherd -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
      - name: Build the shepherd CLI
        run: |
          xcodebuild -project Shepherd.xcodeproj -scheme ShepherdCLI -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build
      - name: Run app unit tests
        run: |
          xcodebuild -project Shepherd.xcodeproj -scheme Shepherd -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO test
      # The same question as the step near the top of this job, asked again at the very end:
      # the tail of the log then answers "which Xcode built this" on its own, without the
      # whole build having to be downloaded to reach the first few lines.
      - name: Repeat the toolchain at the end of the log
        if: always()
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -o 'macosx[0-9.]*' | sort -u | tr '\n' ' '
