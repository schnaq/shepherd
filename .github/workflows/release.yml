name: Release

# Two ways in, one path through:
#
#   * push a `v*` tag — the normal release,
#   * or run it by hand with a version, to re-do a release whose upload failed without moving
#     the tag.
#
# Everything the build does lives in `Scripts/release.sh`, which runs identically on a
# maintainer's Mac (see docs/RELEASING.md). This file only supplies secrets and moves artefacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 1.2.0). Must match CFBundleShortVersionString in project.yml."
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean

# Releases are not something to run two of at once: the appcast is built by extending the
# published feed, so a second run reading a half-published one would drop an item.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Notarized release (macOS)
    # The same labels the app build in ci.yml uses: a release needs Xcode and an Apple Silicon
    # host. It does *not* need anything installed in that runner's keychain — the signing
    # identity arrives as a secret and lives in a keychain this job creates and deletes
    # (`Scripts/ci-signing-setup.sh`), so a new runner needs no preparation beyond Xcode.
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v7

      # ── Fail before spending 20 minutes on a build that cannot be published ───────────────
      #
      # Secrets are not readable in an `if:` on the job, so the guard is the first step. It
      # names the missing secret rather than letting `release.sh` fail on the same thing later,
      # and it names nothing else: the values never reach the log.
      - name: Check the release secrets are present
        env:
          MACOS_DEVID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVID_CERT_P12_BASE64 }}
          MACOS_DEVID_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_CERT_PASSWORD }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A string rather than an array: the runner's /bin/bash is 3.2, where an empty array
          # under `set -u` is its own small adventure.
          missing=""
          for name in MACOS_DEVID_CERT_P12_BASE64 MACOS_DEVID_CERT_PASSWORD NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID NOTARY_API_KEY_P8 SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. They are edited in Infisical and reach this repository through its GitHub sync; docs/RELEASING.md lists where each value comes from. Nothing was built."
            exit 1
          fi
          echo "All release secrets are set."

      # The version reaches the shell through the environment, never through `${{ }}`
      # interpolation into the script body, and is then constrained to digits and dots. It ends
      # up in file paths and a release title, so "it came from a tag" is not good enough.
      - name: Resolve the version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            ''|*[!0-9.]*|.*|*.)
              echo "::error::'$version' is not a version. Expected digits and dots only, e.g. 1.2.0 (tags are v1.2.0)."
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # The Monaco bundle is committed (ADR 0003), but it is rebuilt here anyway so a release
      # can never ship a `dist/` that drifted from `web/diff-viewer/src`. ci.yml enforces that
      # they agree; this makes the release independent of that having been checked.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and test the diff viewer bundle
        run: npm ci && npm test && npm run build
        working-directory: web/diff-viewer

      - name: Install XcodeGen if missing
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
      - run: xcodegen generate

      # A tag push does not run ci.yml — that workflow watches branches and pull requests — so
      # the release runs the suites itself. Shipping a signed, notarized binary that nothing
      # checked is the one failure mode a release pipeline must not have.
      - name: ShepherdKit tests
        run: swift test
        working-directory: Packages/ShepherdKit
      - name: App unit tests
        # `-testLanguage`/`-testRegion`, the same two flags `ci.yml` and `mise run test-app` pass,
        # and they had drifted out of this file. Several tests assert on English sentences, and the
        # test host otherwise takes the *runner's* own language — which is not a safe assumption
        # here, because this job runs on a self-hosted Mac rather than on an English GitHub image.
        # On a German machine fifty-two tests fail against their own translations, which is a fact
        # about the runner and not about the code. mise.toml's header says these two files have to
        # be kept in step by hand; this is that.
        # `-derivedDataPath` is not optional here, and its absence is what wedged four release
        # runs: a bare `xcodebuild` falls back to Xcode's *global* DerivedData, and this project
        # is built by two self-hosted runners on one machine that a single push starts at the same
        # time. Two builds of the same project in one DerivedData block on each other's locks and
        # then sit there silently until somebody cancels them. A path inside the workspace is
        # per-runner by construction, because each runner has its own `_work` directory.
        # mise.toml's header has said this all along; the workflows had not.
        run: |
          xcodebuild -project Shepherd.xcodeproj -scheme Shepherd -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/app \
            -testLanguage en -testRegion US \
            CODE_SIGNING_ALLOWED=NO test

      # Creates the keychain, imports the Developer ID identity, and writes its SHA-1 to
      # $RUNNER_TEMP/signing_identity. The "Remove the signing material" step below undoes all
      # of it, on success and on failure alike.
      #
      # The two secrets are Infisical's, reaching this repository through its GitHub sync rather
      # than through a fetch inside the job: Infisical stays the one place the certificate is
      # edited, and the workflow stays a workflow that reads secrets like any other.
      - name: Set up signing
        env:
          MACOS_DEVID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVID_CERT_P12_BASE64 }}
          MACOS_DEVID_CERT_PASSWORD: ${{ secrets.MACOS_DEVID_CERT_PASSWORD }}
        run: bash "$GITHUB_WORKSPACE/Scripts/ci-signing-setup.sh"

      # notarytool wants the App Store Connect key as a file. It is written outside the
      # workspace and removed in a step that always runs, so it cannot end up in an artefact.
      - name: Write the notarization key
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.shepherd-release"
          printf '%s\n' "$NOTARY_API_KEY_P8" > "$HOME/.shepherd-release/notary.p8"
          chmod 600 "$HOME/.shepherd-release/notary.p8"

      - name: Build, sign, notarize, staple, appcast
        env:
          SHEPHERD_VERSION: ${{ steps.version.outputs.version }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # The PostHog project key (ADR 0036). Unset in a fork, which is exactly right: the
          # release script warns and ships a build with no telemetry mechanism at all.
          POSTHOG_TOKEN: ${{ secrets.POSTHOG_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          export NOTARY_API_KEY_PATH="$HOME/.shepherd-release/notary.p8"
          # The identity the setup step resolved, as a SHA-1. No `DEVELOPMENT_TEAM`: with a
          # manual style and a hash, there is no team for Xcode to match a certificate against,
          # and that match is what used to fail — the team of a Developer ID certificate is
          # already in the certificate.
          export CODESIGN_IDENTITY="$(cat "$RUNNER_TEMP/signing_identity")"
          ./Scripts/release.sh

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Shepherd ${{ steps.version.outputs.version }}
          draft: ${{ inputs.draft == true }}
          # Re-running the workflow for the same tag replaces the assets instead of failing,
          # which is the whole point of the manual trigger.
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/Shepherd-${{ steps.version.outputs.version }}.dmg
            dist/Shepherd-${{ steps.version.outputs.version }}.zip
            dist/appcast.xml

      # `appcast.xml` must be an asset of the *latest* release, because that is what the app's
      # SUFeedURL resolves to (project.yml). A draft release is not "latest", so the feed would
      # keep serving the previous release's appcast — say so rather than let it look published.
      - name: Remind about drafts
        if: ${{ inputs.draft == true }}
        run: echo "::warning::This release is a draft. The Sparkle feed keeps serving the previous release's appcast until it is published."

      # The runner is persistent, so everything this job installed has to come back off it —
      # on a cancelled or failed run too, which is when leaving a signing key behind would
      # matter most.
      - name: Remove the signing material
        if: always()
        run: |
          original="$(cat "$RUNNER_TEMP/orig-default-keychain" 2>/dev/null || true)"
          security default-keychain -s "${original:-$HOME/Library/Keychains/login.keychain-db}" 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/signing_identity" "$RUNNER_TEMP/signing_keychain" \
                "$RUNNER_TEMP/orig-default-keychain" "$RUNNER_TEMP/devid.p12"

      - name: Remove the notarization key
        if: always()
        run: rm -rf "$HOME/.shepherd-release"
